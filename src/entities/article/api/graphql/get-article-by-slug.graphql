query GetArticleBySlug($slug: String!) {
	getArticleBySlug(slug: $slug) {
		id
		title
		slug
		description
		contentJson
		contentHtml
		contentText
		tags
		coverImage
		published
		publishedAt
		readingTime
		views
		reactions
		commentsCount
		createdAt
		updatedAt
		author {
			id
			username
			displayName
			avatarUrl
		}
		category {
			id
			name
			slug
		}
		comments {
			id
			content
			reactions
			myReactions
			createdAt
			updatedAt
			author {
				id
				username
				displayName
				avatarUrl
				role
			}
		}
	}
}
