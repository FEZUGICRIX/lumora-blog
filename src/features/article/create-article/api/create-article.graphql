mutation CreateArticle($input: CreateArticleInput!) {
	createArticle(createArticleInput: $input) {
		id
		title
		slug
		description
		contentJson
		contentHtml
		contentText
		tags
		coverImage
		published
		publishedAt
		readingTime
		views
		likes
		createdAt
		updatedAt
		author {
			id
			displayName
			avatarUrl
		}
		category {
			id
			name
		}
		comments {
			id
			content
			createdAt
			updatedAt
			author {
				id
				displayName
				avatarUrl
			}
		}
	}
}
