mutation UpdateUser($displayName: String!, $isTwoFactorEnabled: Boolean!) {
	updateProfile(
		updateProfileInput: {
			displayName: $displayName
			isTwoFactorEnabled: $isTwoFactorEnabled
		}
	) {
		id
		username
		email
		displayName
		avatar
		role
		method
		emailVerified
		isTwoFactorEnabled
		createdAt
	}
}
